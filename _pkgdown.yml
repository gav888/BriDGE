- title: Analysis pipeline
  contents:
  - bridge_analyze
  - bridge_discover
  - bridge_mediate
  - bridge_sensitivity
  - bridge_compare
- title: Results and visualization
  contents:
  - bridge_plot
  - bridge_summary
- title: Data
  contents:
  - bridge_generate_data
- title: Package
  contents:
  - BriDGE-package

footer:
  structure:
    left: citation
    right: built_with
  components:
    citation: >
      Companion paper: Veltri & Banerjee (in press),
      Behavior Research Methods.
